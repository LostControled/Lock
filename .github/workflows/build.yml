name: Build LockNow

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Checkout TrollCuts source
        run: |
          git clone --depth 1 https://github.com/udevsharold/TrollCuts.git upstream

      - name: Replace app entry point
        run: |
          cat > upstream/TrollCuts/TrollCutsApp.swift <<'SWIFT'
          import SwiftUI
          import UIKit
          import Darwin
          import ObjectiveC.runtime

          @MainActor
          @UIApplicationMain
          final class LockNowAppDelegate: UIResponder, UIApplicationDelegate {
              static var launchedForShortcut = false
              private let rebootShortcut = "com.lostcontroled.locknow.reboot"

              func application(
                  _ application: UIApplication,
                  didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]? = nil
              ) -> Bool {
                  if let shortcut = launchOptions?[.shortcutItem] as? UIApplicationShortcutItem,
                     shortcut.type == rebootShortcut {
                      Self.launchedForShortcut = true
                      Self.rebootDevice()
                  }
                  return true
              }

              func application(
                  _ application: UIApplication,
                  configurationForConnecting connectingSceneSession: UISceneSession,
                  options: UIScene.ConnectionOptions
              ) -> UISceneConfiguration {
                  let configuration = UISceneConfiguration(
                      name: nil,
                      sessionRole: connectingSceneSession.role
                  )
                  configuration.delegateClass = LockNowSceneDelegate.self
                  return configuration
              }

              func application(
                  _ application: UIApplication,
                  performActionFor shortcutItem: UIApplicationShortcutItem,
                  completionHandler: @escaping (Bool) -> Void
              ) {
                  guard shortcutItem.type == rebootShortcut else {
                      completionHandler(false)
                      return
                  }
                  Self.launchedForShortcut = true
                  Self.rebootDevice()
                  completionHandler(true)
              }

              static func lockDevice() {
                  let path = "/System/Library/PrivateFrameworks/ManagedConfiguration.framework/ManagedConfiguration"
                  guard let handle = dlopen(path, RTLD_LAZY) else { return }
                  MCProfileConnection.shared().lockDeviceImmediately(true)
                  dlclose(handle)
              }

              static func dismissAfterLock(_ scene: UIWindowScene) {
                  DispatchQueue.main.asyncAfter(deadline: .now() + 0.35) {
                      if UIDevice.current.userInterfaceIdiom == .phone {
                          // On iPhone, destroying the only scene can leave a stale blank
                          // card. Terminate the app process instead; this does not promise
                          // removal of the SpringBoard app-switcher card.
                          let selector = NSSelectorFromString("terminateWithSuccess")
                          if UIApplication.shared.responds(to: selector) {
                              UIApplication.shared.perform(selector)
                          } else {
                              NSLog("[LockNow] terminateWithSuccess unavailable")
                          }
                      } else {
                          UIApplication.shared.requestSceneSessionDestruction(
                              scene.session,
                              options: nil,
                              errorHandler: nil
                          )
                      }
                  }
              }

              static func lockAndDismiss(_ scene: UIWindowScene) {
                  lockDevice()
                  dismissAfterLock(scene)
              }

              static func rebootDevice() {
                  let frameworkPath = "/System/Library/PrivateFrameworks/FrontBoardServices.framework/FrontBoardServices"
                  guard let handle = dlopen(frameworkPath, RTLD_NOW) else {
                      NSLog("[LockNow] FrontBoardServices load failed")
                      return
                  }

                  guard let cls = NSClassFromString("FBSSystemService") else {
                      NSLog("[LockNow] FBSSystemService class unavailable")
                      dlclose(handle)
                      return
                  }

                  let sharedSelector = NSSelectorFromString("sharedService")
                  guard let sharedMethod = class_getClassMethod(cls, sharedSelector) else {
                      NSLog("[LockNow] FBSSystemService.sharedService unavailable")
                      dlclose(handle)
                      return
                  }
                  typealias SharedFunction = @convention(c) (AnyObject, Selector) -> Unmanaged<AnyObject>?
                  let getShared = unsafeBitCast(method_getImplementation(sharedMethod), to: SharedFunction.self)
                  guard let service = getShared(cls as AnyObject, sharedSelector)?.takeUnretainedValue() else {
                      NSLog("[LockNow] FBSSystemService instance unavailable")
                      dlclose(handle)
                      return
                  }

                  let rebootSelector = NSSelectorFromString("reboot")
                  guard let rebootMethod = class_getInstanceMethod(cls, rebootSelector) else {
                      NSLog("[LockNow] FBSSystemService.reboot unavailable")
                      dlclose(handle)
                      return
                  }
                  typealias RebootFunction = @convention(c) (AnyObject, Selector) -> Void
                  let reboot = unsafeBitCast(method_getImplementation(rebootMethod), to: RebootFunction.self)
                  NSLog("[LockNow] invoking FBSSystemService.reboot")
                  reboot(service, rebootSelector)
                  dlclose(handle)
              }
          }

          final class LockNowController: UIViewController {
              // Keep this process-wide: viewDidAppear may run again when the app
              // returns from the app switcher or reconnects its scene.
              private static var lockActionStarted = false

              override func viewDidAppear(_ animated: Bool) {
                  super.viewDidAppear(animated)
                  guard !Self.lockActionStarted else { return }
                  guard !LockNowAppDelegate.launchedForShortcut else { return }
                  guard let scene = view.window?.windowScene else { return }

                  Self.lockActionStarted = true
                  LockNowAppDelegate.lockAndDismiss(scene)
              }
          }

          struct LockNowLauncher: UIViewControllerRepresentable {
              func makeUIViewController(context: Context) -> LockNowController {
                  LockNowController()
              }

              func updateUIViewController(_ controller: LockNowController, context: Context) {}
          }

          final class LockNowSceneDelegate: UIResponder, UIWindowSceneDelegate {
              var window: UIWindow?

              func scene(
                  _ scene: UIScene,
                  willConnectTo session: UISceneSession,
                  options connectionOptions: UIScene.ConnectionOptions
              ) {
                  guard let windowScene = scene as? UIWindowScene else { return }

                  if connectionOptions.shortcutItem?.type == "com.lostcontroled.locknow.reboot" {
                      LockNowAppDelegate.launchedForShortcut = true
                      DispatchQueue.main.asyncAfter(deadline: .now() + 0.2) {
                          LockNowAppDelegate.rebootDevice()
                      }
                  }

                  let window = UIWindow(windowScene: windowScene)
                  window.rootViewController = UIHostingController(rootView: LockNowLauncher().ignoresSafeArea())
                  self.window = window
                  window.makeKeyAndVisible()
              }

              func windowScene(
                  _ windowScene: UIWindowScene,
                  performActionFor shortcutItem: UIApplicationShortcutItem,
                  completionHandler: @escaping (Bool) -> Void
              ) {
                  guard shortcutItem.type == "com.lostcontroled.locknow.reboot" else {
                      completionHandler(false)
                      return
                  }
                  LockNowAppDelegate.launchedForShortcut = true
                  LockNowAppDelegate.rebootDevice()
                  completionHandler(true)
              }
          }
          SWIFT

      - name: Build and package TrollStore app
        run: |
          set -euo pipefail
          brew install ldid
          xcodebuild \
            -project upstream/TrollCuts.xcodeproj \
            -scheme TrollCuts \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            PRODUCT_BUNDLE_IDENTIFIER=com.lostcontroled.locknow \
            INFOPLIST_KEY_CFBundleDisplayName="一键锁屏" \
            build

          APP="build/DerivedData/Build/Products/Release-iphoneos/TrollCuts.app"
          test -d "$APP"

          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.2" "$APP/Info.plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 1.2" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" "$APP/Info.plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${GITHUB_RUN_NUMBER}" "$APP/Info.plist"

          /usr/libexec/PlistBuddy -c "Add :UIApplicationShortcutItems array" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UIApplicationShortcutItems:0 dict" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UIApplicationShortcutItems:0:UIApplicationShortcutItemType string com.lostcontroled.locknow.reboot" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UIApplicationShortcutItems:0:UIApplicationShortcutItemTitle string 重启设备" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UIApplicationShortcutItems:0:UIApplicationShortcutItemSubtitle string 立即重新启动设备" "$APP/Info.plist"

          codesign --remove "$APP" || true
          rm -rf "$APP/_CodeSignature" "$APP/embedded.mobileprovision"
          ldid -Supstream/entitlements.plist "$APP/TrollCuts"

          rm -rf Payload LockNow.tipa
          mkdir Payload
          cp -R "$APP" Payload/LockNow.app
          /usr/bin/zip -qry LockNow.tipa Payload
          test -s LockNow.tipa

      - name: Upload .tipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: LockNow-tipa
          path: LockNow.tipa
          if-no-files-found: error
